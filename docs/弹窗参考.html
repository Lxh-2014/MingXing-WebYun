<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高斯模糊弹窗</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body {
            min-height: 100vh;
            padding: 40px;
            background: #f8fafc;
        }

        /* 模糊遮罩 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            visibility: hidden;
            transition: 0.3s ease;
            z-index: 999;
        }

        /* 弹窗 正确居中写法 */
        .modal {
            position: fixed;
            inset: 0;
            margin: auto;
            width: 100%;
            max-width: 460px;
            height: fit-content;
            padding: 30px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
            opacity: 0;
            visibility: hidden;
            transform: scale(0.9);
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            z-index: 1000;
        }

        .modal-overlay.active,
        .modal.active {
            opacity: 1;
            visibility: visible;
        }
        .modal.active {
            transform: scale(1);
        }

        /* 关闭按钮 纯文字 无背景无边框 位置正确 */
        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            color: #999;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal-close:hover {
            color: #333;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: #222;
            margin-bottom: 15px;
        }
        .modal-content {
            font-size: 15px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }
        .btn {
            padding: 9px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-secondary {
            background: #eee;
            color: #555;
        }
        .btn-primary {
            background: #2563eb;
            color: #fff;
        }
        .open-btn {
            padding: 12px 24px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button class="open-btn" onclick="openModal()">打开弹窗</button>

    <div class="modal-overlay"></div>

    <div class="modal" id="myModal">
        <button class="modal-close" onclick="closeModal()">×</button>
        <div class="modal-title">温馨提示</div>
        <div class="modal-content">确定要执行此操作吗？操作后无法撤回，请谨慎确认。</div>
        <div class="modal-buttons">
            <button class="btn btn-secondary" onclick="closeModal()">取消</button>
            <button class="btn btn-primary">确定</button>
        </div>
    </div>

    <script>
        const modal = document.getElementById('myModal');
        const overlay = document.querySelector('.modal-overlay');

        function openModal(){
            modal.classList.add('active');
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeModal(){
            modal.classList.remove('active');
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }
        // ESC关闭
        document.addEventListener('keydown',e=>{
            if(e.key==='Escape') closeModal();
        })
        // 禁止弹窗内点击关闭
        modal.addEventListener('click',e=>e.stopPropagation())
    </script>
</body>
</html>
